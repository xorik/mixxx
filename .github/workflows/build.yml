name: Build
'on':
  push: null
  pull_request: null
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { include: [{ name: 'macOS 11 arm64', os: macos-11, cmake_args: '-DBULK=ON -DCOREAUDIO=ON -DHSS1394=ON -DMACOS_BUNDLE=ON -DMODPLUG=ON -DQT6=ON -DWAVPACK=ON -DVCPKG_TARGET_TRIPLET=arm64-osx-min1100 -DVCPKG_DEFAULT_HOST_TRIPLET=x64-osx-min1015', crosscompile: true, cpack_generator: DragNDrop, compiler_cache: ccache, compiler_cache_path: /Users/runner/Library/Caches/ccache, buildenv_basepath: /Users/runner/buildenv, buildenv_script: tools/macos_arm64-cross-release_buildenv.sh, artifacts_name: 'macOS ARM DMG', artifacts_path: 'build/*.dmg', artifacts_slug: macos-macosarm, qt_qpa_platform: offscreen }] }
    env:
      SCCACHE_VERSION: 0.3.0
      APPLE_CODESIGN_IDENTITY: 2C2B5D3EDCE82BA55E22E9A67F16F8D03E390870
      MACOS_CODESIGN_OPENSSL_PASSWORD: '${{ secrets.MACOS_CODESIGN_OPENSSL_PASSWORD }}'
      MACOS_CODESIGN_CERTIFICATE_PASSWORD: '${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}'
    runs-on: '${{ matrix.os }}'
    name: '${{ matrix.name }}'
    container: '${{ matrix.container }}'
    outputs:
      artifact-macos-macosintel: '${{ steps.prepare_deploy.outputs.artifact-macos-macosintel }}'
      artifact-macos-macosarm: '${{ steps.prepare_deploy.outputs.artifact-macos-macosarm }}'
      artifact-windows-win64: '${{ steps.prepare_deploy.outputs.artifact-windows-win64 }}'
    steps:
      - { name: '[Windows] Set up Cargo cache', if: "runner.os == 'Windows'", uses: actions/cache@v3, id: sccache-build-cache, with: { path: 'C:\Users\runneradmin\.cargo', key: 'sccache-${{ env.SCCACHE_VERSION }}' } }
      - { name: '[Windows] Build and install sccache', shell: bash, if: "runner.os == 'Windows' && steps.sccache-build-cache.outputs.cache-hit != 'true'", run: 'cargo install --version "${{ env.SCCACHE_VERSION }}" sccache' }
      - { name: 'Check out repository', uses: actions/checkout@v4, with: { fetch-depth: 0 } }
      - { name: "[Arch Linux] Workaround for the 'unsafe repository' issue caused by CVE-2022-24765", if: 'matrix.container != null', run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"' }
      - { name: 'Ensure that all tags are fetched', run: 'git fetch origin --force --tags' }
      - { name: '[macOS] Set up cmake', uses: jwlawson/actions-setup-cmake@v1.14, if: "runner.os == 'macOS'", with: { cmake-version: 3.21.x } }
      - { name: '[Windows] Set up MSVC Developer Command Prompt', if: "runner.os == 'Windows'", uses: seanmiddleditch/gha-setup-vsdevenv@v4 }
      - { name: '[macOS] install ccache and make', if: "runner.os == 'macOS'", run: "brew install ccache ninja\n" }
      - { name: '[macOS/Windows] Get build environment name', if: "runner.os != 'Linux'", id: buildenv_name, run: '${{ matrix.buildenv_script }} name' }
      - { name: '[macOS/Windows] Set up build environment cache', if: "runner.os != 'Linux'", uses: actions/cache@v3, with: { path: '${{ matrix.buildenv_basepath }}', key: '${{ runner.os }}-buildenv-${{ env.BUILDENV_NAME }}' } }
      - { name: '[macOS] Import Apple code signing identity', id: apple_codesign, if: "runner.os == 'macOS' && env.MACOS_CODESIGN_OPENSSL_PASSWORD != null && env.MACOS_CODESIGN_CERTIFICATE_PASSWORD != null", run: "# Decrypt the certificate\nopenssl enc -aes-256-cbc -d -md sha512 \\\n  -k \"${MACOS_CODESIGN_OPENSSL_PASSWORD}\" \\\n  -in /Users/runner/work/mixxx/mixxx/packaging/certificates/macos_developer_id_codesign_certificate.p12.enc \\\n  -out ~/certificate.p12\n\n# Create a temporary keychain for the certificate and import it.\nsecurity create-keychain -p mixxx Mixxx.keychain\nsecurity unlock-keychain -p mixxx Mixxx.keychain\nsecurity import ~/certificate.p12 -k Mixxx.keychain \\\n  -P \"${MACOS_CODESIGN_CERTIFICATE_PASSWORD}\" -A\nsecurity set-key-partition-list -S \"apple-tool:,apple:\" -k mixxx Mixxx.keychain\n# Add keychain to search list\nsecurity list-keychains -s Mixxx.keychain\n# Prevent keychain access from timing out\nsecurity set-keychain-settings Mixxx.keychain\necho \"CMAKE_ARGS_EXTRA=${CMAKE_ARGS_EXTRA} -DAPPLE_CODESIGN_IDENTITY=${APPLE_CODESIGN_IDENTITY}\" >> \"${GITHUB_ENV}\"\n" }
      - { name: '[Windows] Set up Windows code signing', env: { WINDOWS_CODESIGN_CERTIFICATE_PATH: '${{ github.workspace }}\packaging\certificates\windows_sectigo_codesign_certificate.pfx', WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: '${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}', WINDOWS_CODESIGN_SECURE_FILE_SALT: '${{ secrets.WINDOWS_CODESIGN_SECURE_FILE_SALT }}', WINDOWS_CODESIGN_SECURE_FILE_SECRET: '${{ secrets.WINDOWS_CODESIGN_SECURE_FILE_SECRET }}' }, if: "runner.os == 'Windows' && env.WINDOWS_CODESIGN_SECURE_FILE_SALT != null && env.WINDOWS_CODESIGN_SECURE_FILE_SECRET != null", run: "iex ((New-Object Net.WebClient).DownloadString('https://raw.githubusercontent.com/appveyor/secure-file/master/install.ps1'))\nappveyor-tools/secure-file -decrypt \"$Env:WINDOWS_CODESIGN_CERTIFICATE_PATH.enc\" -secret \"$Env:WINDOWS_CODESIGN_SECURE_FILE_SECRET\" -salt \"$Env:WINDOWS_CODESIGN_SECURE_FILE_SALT\"\nAdd-Content -Path \"$Env:GITHUB_ENV\" -Value \"WINDOWS_CODESIGN_CERTIFICATE_PATH=$Env:WINDOWS_CODESIGN_CERTIFICATE_PATH\"\nAdd-Content -Path \"$Env:GITHUB_ENV\" -Value \"WINDOWS_CODESIGN_CERTIFICATE_PASSWORD=$Env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD\"\nAdd-Content -Path \"$Env:GITHUB_ENV\" -Value \"CMAKE_ARGS_EXTRA=-DWINDOWS_CODESIGN=ON\"\n" }
      - { name: 'Set up build environment', id: buildenv, if: 'matrix.buildenv_script != null', run: '${{ matrix.buildenv_script }} setup', env: { BUILDENV_BASEPATH: '${{ matrix.buildenv_basepath }}' } }
      - { name: '[Ubuntu/macOS] Set compiler cache size limit', run: '${{ matrix.compiler_cache }} -M 524288', if: "runner.os != 'windows'" }
      - { name: 'Set up compiler cache', uses: actions/cache@v3, with: { path: '${{ matrix.compiler_cache_path }}', key: '${{ matrix.os }}-${{ matrix.compiler_cache }}-${{ github.head_ref }}-${{ github.run_number }}', restore-keys: "${{ matrix.os }}-${{ matrix.compiler_cache }}-${{ github.head_ref }}\n${{ matrix.os }}-${{ matrix.compiler_cache }}\n" } }
      - { name: 'Create build directory', run: 'mkdir build' }
      - { name: Configure, run: 'cmake ${{ matrix.cmake_args }} ${{ env.CMAKE_ARGS_EXTRA }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}" -DWARNINGS_FATAL=ON -DDEBUG_ASSERTIONS_FATAL=OFF -DBATTERY=ON -DBROADCAST=ON -DDOWNLOAD_MANUAL=ON -DHID=ON -DKEYFINDER=ON -DLILV=ON -DOPUS=ON -DQTKEYCHAIN=ON -DVINYLCONTROL=ON -DCMAKE_VERBOSE_MAKEFILE=OFF -L ..', working-directory: build, env: { CC: '${{ matrix.cc }}', CXX: '${{ matrix.cxx }}' } }
      - { name: '[Ubuntu/macOS] Set up gcc/clang problem matcher', if: "runner.os != 'Windows'", uses: ammaraskar/gcc-problem-matcher@master }
      - { name: '[Windows] Set up MSVC problem matcher', if: "runner.os == 'Windows'", uses: ammaraskar/msvc-problem-matcher@master }
      - { name: Build, run: 'cmake --build . --config RelWithDebInfo', working-directory: build, env: { CC: '${{ matrix.cc }}', CXX: '${{ matrix.cxx }}', CMAKE_BUILD_PARALLEL_LEVEL: 2, CCACHE_NOCOMPRESS: true, SCCACHE_CACHE_SIZE: 2G } }
      - { name: 'Print compiler cache stats', run: '${{ matrix.compiler_cache }} -s' }
      - { name: Test, if: 'matrix.crosscompile != true', run: 'ctest --timeout 45 ${{ matrix.ctest_args }}', working-directory: build, env: { QT_QPA_PLATFORM: '${{ matrix.qt_qpa_platform }}', GTEST_COLOR: 1, CTEST_PARALLEL_LEVEL: 1, CTEST_OUTPUT_ON_FAILURE: 1 } }
      - { name: Benchmark, if: 'matrix.crosscompile != true', run: 'cmake --build . --target mixxx-benchmark --config RelWithDebInfo', working-directory: build, env: { QT_QPA_PLATFORM: '${{ matrix.qt_qpa_platform }}' } }
      - { name: Package, if: 'matrix.cpack_generator != null', run: 'cpack -G ${{ matrix.cpack_generator }} -V', working-directory: build }
      - { name: '[Ubuntu] Import PPA GPG key', if: "startsWith(matrix.os, 'ubuntu') && env.RRYAN_AT_MIXXX_DOT_ORG_GPG_PRIVATE_KEY != null", run: 'gpg --import <(echo "${{ secrets.RRYAN_AT_MIXXX_DOT_ORG_GPG_PRIVATE_KEY }}")', env: { RRYAN_AT_MIXXX_DOT_ORG_GPG_PRIVATE_KEY: '${{ secrets.RRYAN_AT_MIXXX_DOT_ORG_GPG_PRIVATE_KEY }}' } }
      - { name: 'Package for PPA', if: "matrix.name == 'Ubuntu 22.04 (gcc)'", run: "if [[ \"${{ github.ref }}\" == \"refs/heads/main\" ]] && [[ \"${{ github.repository }}\" == \"mixxxdj/mixxx\" ]]; then\n  CPACK_ARGS=\"-D DEB_UPLOAD_PPA=ppa:mixxx/nightlies\"\nelif [[ \"${{ github.ref }}\" == \"refs/heads/2.4\" ]] && [[ \"${{ github.repository }}\" == \"mixxxdj/mixxx\" ]]; then\n  CPACK_ARGS=\"-D DEB_UPLOAD_PPA=ppa:mixxx/mixxxbetas\"\nelif [[ \"${{ github.ref }}\" =~ ^refs/tags/[0-9]+\\.[0-9]+\\.[0-9]+$ ]] && [[ \"${{ github.repository }}\" == \"mixxxdj/mixxx\" ]]; then\n  CPACK_ARGS=\"-D DEB_UPLOAD_PPA=ppa:mixxx/mixxx\"\nelse\n  # only build the source DEB, do not upload\n  CPACK_ARGS=\"-D DEB_SOURCEPKG=ON\"\nfi\ncpack -G External $CPACK_ARGS\n", working-directory: build }
      - { name: '[macOS] Sign, Notarize, and Staple Package', if: "runner.os == 'macOS' && env.MACOS_CODESIGN_OPENSSL_PASSWORD != null && env.MACOS_CODESIGN_CERTIFICATE_PASSWORD != null && env.APPLE_APP_SPECIFIC_PASSWORD != null", run: 'packaging/macos/sign_notarize_staple.sh build/*.dmg', env: { APPLE_ID_USERNAME: rryan@mixxx.org, APPLE_BUNDLE_ID: org.mixxx.mixxx, APPLE_APP_SPECIFIC_PASSWORD: '${{ secrets.MACOS_NOTARIZATION_APP_SPECIFIC_PASSWORD }}', ASC_PROVIDER: FLYL4D545V } }
      - { name: '[Windows] Sign Package', if: "runner.os == 'Windows' && env.WINDOWS_CODESIGN_CERTIFICATE_PATH != null && env.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD != null", run: 'signtool sign /tr http://timestamp.sectigo.com /td sha256 /fd sha256 /f $Env:WINDOWS_CODESIGN_CERTIFICATE_PATH /p $Env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD *.msi', working-directory: build }
      - { name: 'Prepare for deployment', id: prepare_deploy, if: "github.event_name == 'push' && matrix.artifacts_path != null", shell: bash, run: "if [[ \"${GITHUB_REF}\" =~ ^refs/tags/.* ]]; then\n  export DEPLOY_PATH='releases/{git_describe}/mixxx-{git_describe}-{package_slug}{ext}';\nelse\n  export DEPLOY_PATH='snapshots/{git_branch}/mixxx-{git_describe}-{package_slug}{ext}';\nfi; python3 tools/deploy.py prepare-deployment --slug '${{ matrix.artifacts_slug }}' --output-dir 'deploy/' --dest-path \"${DEPLOY_PATH}\" --dest-url 'https://downloads.mixxx.org' ${{ matrix.artifacts_path }}\n" }
      - { name: '[Windows] Install rsync and openssh', env: { SSH_PRIVATE_KEY: '${{ secrets.DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY }}' }, if: "runner.os == 'Windows' && github.event_name == 'push' && env.SSH_PRIVATE_KEY != null", run: "$Env:PATH=\"c:\\msys64\\usr\\bin;$Env:PATH\"\npacman -S --noconfirm coreutils bash rsync openssh\n# Unfortunately, mixing executables from msys64 and mingw (i.e. Git\n# Bash) does not work properly and leads to errors like these:\n#\n#     0 [main] python3 (5248) C:\\msys64\\usr\\bin\\python3.exe: *** fatal error - cygheap base mismatch detected - 0x180347408/0x180352408.\n#\n# Even when prepending the MSYS2 binary directory to %PATH%, GitHub\n# Actions will still pick the Git Bash executable over the MSYS2 one\n# when using `shell: bash`. Since it's not feasible to set `shell` to\n# an absolute path in a cross-platform build workflow, we overwrite the\n# git bash executable with the MSYS2 one.\n#\n# Also see related issue:\n# https://github.com/actions/virtual-environments/issues/594\nCopy-Item -Path \"C:\\msys64\\usr\\bin\\bash.exe\" -Destination \"C:\\Program Files\\Git\\bin\\bash.exe\" -Force\n# By default, MSYS2 uses an\n# /etc/profile file that changes\n# the current working directory\n# when bash is started. We don't\n# want this behavior,so we just\n# delete it.\nRemove-Item -Path \"C:\\msys64\\etc\\profile\"\n# Add MSYS2's tools to %PATH%.\nAdd-Content -Path \"$Env:GITHUB_ENV\" -Value \"PATH=$Env:PATH\"\n" }
      - { name: 'Set up SSH Agent', if: "github.event_name == 'push' && env.SSH_PRIVATE_KEY != null", shell: bash, env: { SSH_AUTH_SOCK: /tmp/ssh_agent.sock, SSH_PRIVATE_KEY: '${{ secrets.DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY }}', SSH_HOST: downloads-hostgator.mixxx.org }, run: "ssh-agent -a $SSH_AUTH_SOCK > /dev/null\nssh-add - <<< \"${SSH_PRIVATE_KEY}\"\nmkdir -p \"${HOME}/.ssh\"\nssh-keyscan \"${SSH_HOST}\" >> \"${HOME}/.ssh/known_hosts\"\necho \"SSH_AUTH_SOCK=${SSH_AUTH_SOCK}\" >> \"${GITHUB_ENV}\"\n" }
      - { name: '[macOS/Windows] Upload build to downloads.mixxx.org', if: "runner.os != 'Linux' && github.event_name == 'push' && env.SSH_AUTH_SOCK != null", shell: 'bash --login -eo pipefail "{0}"', run: 'rsync --verbose --recursive --checksum --times --delay-updates "deploy/" "${SSH_USER}@${SSH_HOST}:${DESTDIR}/"', env: { DESTDIR: public_html/downloads, SSH_HOST: downloads-hostgator.mixxx.org, SSH_USER: mixxx } }
      - { name: 'Use system tar & zstd from Chocolatey for caching', if: "runner.os == 'Windows'", shell: bash, run: "echo \"C:/Windows/System32;C:/ProgramData/Chocolatey/bin\" >> $GITHUB_PATH\n" }
      - { name: 'Upload GitHub Actions artifacts', if: 'matrix.artifacts_path != null', uses: actions/upload-artifact@v3.1.2, with: { name: '${{ matrix.artifacts_name }}', path: '${{ matrix.artifacts_path }}' } }
  update_manifest:
    name: 'Update manifest file on download server'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - { name: 'Check out repository', uses: actions/checkout@v4, with: { fetch-depth: 0 } }
      - { name: 'Ensure that all tags are fetched', run: 'git fetch origin --force --tags' }
      - { name: 'Collect Artifacts Metadata & Write Manifest', if: "github.event_name == 'push' && env.SSH_PASSWORD != null", run: "if [[ \"${GITHUB_REF}\" =~ ^refs/tags/.* ]]; then\n  export DEPLOY_PATH='releases/{git_describe}/manifest.json';\nelse\n  export DEPLOY_PATH='snapshots/{git_branch}/manifest.json';\nfi; python3 tools/deploy.py generate-manifest --output-dir 'deploy/' --dest-path \"${DEPLOY_PATH}\" --dest-url 'https://downloads.mixxx.org'\n", env: { JOB_DATA: '${{ toJSON(needs.build) }}', SSH_PASSWORD: '${{ secrets.DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY_PASSWORD }}' } }
      - { name: 'Set up SSH Agent', if: "github.event_name == 'push' && env.SSH_PRIVATE_KEY != null  && env.MANIFEST_DIRTY != null && env.MANIFEST_DIRTY != '0'", shell: bash, env: { SSH_AUTH_SOCK: /tmp/ssh_agent.sock, SSH_PRIVATE_KEY: '${{ secrets.DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY }}', SSH_HOST: downloads-hostgator.mixxx.org }, run: "ssh-agent -a $SSH_AUTH_SOCK > /dev/null\nssh-add - <<< \"${SSH_PRIVATE_KEY}\"\nmkdir -p \"${HOME}/.ssh\"\nssh-keyscan \"${SSH_HOST}\" >> \"${HOME}/.ssh/known_hosts\"\necho \"SSH_AUTH_SOCK=${SSH_AUTH_SOCK}\" >> \"${GITHUB_ENV}\"\n" }
      - { name: 'Deploy Manifest', if: "github.event_name == 'push' && env.SSH_AUTH_SOCK != null", shell: bash, run: 'rsync --verbose --recursive --checksum --times --delay-updates "deploy/" "${SSH_USER}@${SSH_HOST}:${DESTDIR}/"', env: { DESTDIR: public_html/downloads, SSH_HOST: downloads-hostgator.mixxx.org, SSH_USER: mixxx } }
      - { name: 'Trigger Netlify build', if: "env.NETLIFY_BUILD_HOOK != null && env.MANIFEST_DIRTY != null && env.MANIFEST_DIRTY != '0'", run: "curl -X POST -d '{}' ${{ env.NETLIFY_BUILD_HOOK }}", env: { NETLIFY_BUILD_HOOK: '${{ secrets.NETLIFY_BUILD_HOOK }}' } }
